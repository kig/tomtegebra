<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomtegebra - Algebra Puzzle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="900" height="570"></canvas>
        <div id="instructions">
            <h2>Instructions</h2>
            <ul>
                <li>Move cursor with <strong>left</strong> and <strong>right</strong> arrow keys.</li>
                <li>Scroll the inventory with <strong>up</strong> and <strong>down</strong> arrow keys.</li>
                <li>Press <strong>space</strong> to apply the currently selected transformation.</li>
                <li>Press <strong>q</strong> to restart.</li>
            </ul>
        </div>
    </div>
    <script src="algebra.js"></script>
    <script src="game.js"></script>
    <script src="render.js"></script>
    <script src="main.js"></script>
</body>
</html>
